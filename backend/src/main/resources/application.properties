spring.application.name=algarrobo-api

# Credenciales: en tu máquina, backend/config/local.properties (no se versiona; ver local.properties.example).
# En producción, variables de entorno ALGARROBO_DB_URL, ALGARROBO_DB_USUARIO y ALGARROBO_DB_CLAVE.
spring.config.import=optional:file:./config/local.properties
spring.datasource.url=${ALGARROBO_DB_URL:${algarrobo.db.url:jdbc:postgresql://localhost:5432/algarrobo}}
spring.datasource.username=${ALGARROBO_DB_USUARIO:${algarrobo.db.usuario:algarrobo_app}}
spring.datasource.password=${ALGARROBO_DB_CLAVE:${algarrobo.db.clave:}}
spring.datasource.hikari.maximum-pool-size=10

spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

# La API responde siempre JSON; los errores tienen la forma { codigo, mensaje, errores, alternativas }.
spring.jackson.default-property-inclusion=non_null
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Límite de peticiones por IP y por minuto, separado por tipo de acción (ver LimitePorIpFiltro).
algarrobo.limite.reservar=10
algarrobo.limite.apartar=30
algarrobo.limite.consultar=30
algarrobo.limite.acceso=5

# Detrás de un proxy (Render, y Vercel delante) la app debe leer X-Forwarded-For/Proto para saber la IP
# real y que la conexión es HTTPS. En producción: ALGARROBO_PROXY=native. En local queda en none.
server.forward-headers-strategy=${ALGARROBO_PROXY:none}

# Panel: la sesión caduca tras 8 horas sin actividad. En producción (HTTPS) la cookie debe ser Secure.
server.servlet.session.timeout=8h
server.servlet.session.cookie.secure=${ALGARROBO_COOKIE_SEGURA:false}
server.servlet.session.cookie.name=ALGARROBO_SESION

# Primer administrador del panel: se crea solo si no hay usuarios. Ponlo en config/local.properties
# (algarrobo.admin.correo / algarrobo.admin.clave) o en ALGARROBO_ADMIN_CORREO / ALGARROBO_ADMIN_CLAVE.
algarrobo.admin.correo=${ALGARROBO_ADMIN_CORREO:}
algarrobo.admin.clave=${ALGARROBO_ADMIN_CLAVE:}

# La página pública se sirve desde la carpeta del proyecto, pero SOLO index.html, js/ y assets/
# (ver SitioConfig): así no se expone nada más de la carpeta, como config/local.properties.
algarrobo.sitio.carpeta=${ALGARROBO_SITIO:../}
spring.web.resources.add-mappings=false

# Plazo de conservación: pasados estos meses desde la fecha de una reserva se borran nombre, contacto
# y comentarios (ver PrivacidadServicio). Se ejecuta cada madrugada.
algarrobo.privacidad.meses-conservacion=12

# Fotos de la carta subidas desde el panel (la validación de tipo y tamaño está en FotosServicio).
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB
