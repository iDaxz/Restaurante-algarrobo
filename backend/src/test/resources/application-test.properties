# Pruebas de integración: base APARTE (algarrobo_test), que se vacía y se vuelve a crear en cada ejecución.
spring.datasource.url=${ALGARROBO_DB_URL_PRUEBAS:${algarrobo.db.url-pruebas:jdbc:postgresql://localhost:5432/algarrobo_test}}
spring.flyway.clean-disabled=false
# El límite por IP tiene su propia prueba; aquí no debe interferir con los demás casos.
algarrobo.limite.reservar=100000
algarrobo.limite.apartar=100000
algarrobo.limite.consultar=100000
algarrobo.limite.acceso=100000
# Usuario de prueba del panel (solo en la base algarrobo_test).
algarrobo.admin.correo=admin@prueba.test
algarrobo.admin.clave=clave-de-prueba-larga
algarrobo.admin.nombre=Admin de Prueba
